<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor BMD</title>
<style>
  :root {
    --bg: #14161b; --panel: #1b1e25; --line: #2b2f39; --text: #dde1e8; --dim: #8b93a3;
    --accent: #6cb6ff; --ok: #67d391; --warn: #f2c14e; --bad: #ff7b72;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  #app { display: grid; grid-template-columns: 330px 1fr 320px; height: 100vh; }
  aside { background: var(--panel); overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
  #side { border-right: 1px solid var(--line); }
  #panel { border-left: 1px solid var(--line); overflow-y: auto; }
  header { padding: 12px 12px 6px; }
  h1 { font-size: 15px; margin: 0 0 2px; }
  #root { color: var(--dim); font-size: 11px; word-break: break-all; margin-top: 6px; }
  .rootrow { display: flex; gap: 6px; margin-top: 8px; }
  #pick { flex: none; }
  #recent { flex: 1; min-width: 0; }
  #q { margin: 6px 12px; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  #count { color: var(--dim); font-size: 11px; padding: 0 12px 6px; }
  #list { overflow-y: auto; flex: 1; padding-bottom: 20px; }
  .folder { position: sticky; top: 0; background: #20242c; color: var(--dim); font-size: 11px; padding: 5px 12px; border-top: 1px solid var(--line); word-break: break-all; z-index: 1; }
  .item { padding: 4px 12px 4px 20px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item:hover { background: #252a33; }
  .item.sel { background: #1f3b5c; color: #fff; }
  main { position: relative; min-width: 0; }
  canvas#gl { width: 100%; height: 100%; display: block; cursor: grab; }
  canvas#gl:active { cursor: grabbing; }
  #hud { position: absolute; top: 10px; left: 12px; pointer-events: none; text-shadow: 0 1px 2px #000; }
  #title { font-size: 16px; font-weight: 600; }
  #sub { color: var(--dim); font-size: 12px; }
  #help { position: absolute; top: 10px; right: 12px; color: var(--dim); font-size: 11px; text-align: right; pointer-events: none; text-shadow: 0 1px 2px #000; }
  #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; color: var(--dim); font-size: 14px; text-align: center; padding: 20px; }
  #msg.err { color: var(--bad); }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 8px 12px; background: rgba(20,22,27,.88); border-top: 1px solid var(--line); }
  #bar label { display: flex; align-items: center; gap: 6px; color: var(--dim); }
  select, button { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 4px 8px; font: inherit; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  .mhead span:last-child { white-space: nowrap; }
  input[type=range] { width: 110px; }
  section { padding: 10px 12px; border-bottom: 1px solid var(--line); }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); margin: 0 0 8px; }
  #warn { list-style: none; margin: 0; padding: 0; }
  #warn li { padding: 3px 0 3px 18px; position: relative; }
  #warn li::before { content: "●"; position: absolute; left: 2px; font-size: 10px; top: 5px; }
  #warn li.ok::before { color: var(--ok); } #warn li.warn::before { color: var(--warn); } #warn li.bad::before { color: var(--bad); }
  .mesh { display: grid; grid-template-columns: 18px 56px 1fr; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
  .mesh:first-child { border-top: 0; }
  .thumb { width: 56px; height: 56px; border-radius: 4px; cursor: zoom-in; display: block;
    background: repeating-conic-gradient(#2a2e37 0 25%, #20232a 0 50%) 0 0/12px 12px; object-fit: contain; }
  .mname { font-weight: 600; word-break: break-all; }
  .mnote { font-size: 11px; color: var(--dim); word-break: break-all; }
  .mnote.ok { color: var(--ok); } .mnote.warn { color: var(--warn); } .mnote.bad { color: var(--bad); }
  .mesh select { margin-top: 3px; padding: 1px 4px; font-size: 11px; }
  #folderTex { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }
  .ft { font-size: 10px; color: var(--dim); word-break: break-all; text-align: center; }
  .ft .thumb { width: 100%; height: 64px; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: flex; align-items: center; justify-content: center; z-index: 10; }
  #modal[hidden] { display: none; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; max-width: 92vw; max-height: 92vh; display: flex; flex-direction: column; }
  .mhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); word-break: break-all; }
  .mimg { overflow: auto; padding: 12px; background: repeating-conic-gradient(#2a2e37 0 25%, #20232a 0 50%) 0 0/16px 16px; }
  #mcanvas { display: block; max-width: 86vw; max-height: 74vh; image-rendering: pixelated; }
  #minfo { padding: 8px 12px; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <h1>Visor BMD · MU</h1>
      <div class="rootrow">
        <button id="pick" title="Elegir la carpeta base de un pack">📁 Elegir carpeta…</button>
        <select id="recent" title="Carpetas recientes"></select>
      </div>
      <div id="root">cargando…</div>
    </header>
    <input id="q" placeholder="Buscar: wing, set, pet, npc… (↑ ↓ para recorrer)" autocomplete="off">
    <div id="count"></div>
    <div id="list"></div>
  </aside>

  <main>
    <canvas id="gl"></canvas>
    <div id="hud"><div id="title"></div><div id="sub"></div></div>
    <div id="help">Arrastrar: rotar · Clic derecho / Shift: mover<br>Rueda: zoom · Doble clic: centrar</div>
    <div id="msg">Elegí un modelo de la lista</div>
    <div id="bar">
      <label>Animación <select id="act"></select></label>
      <button id="play" title="Reproducir / pausar">⏸</button>
      <label>Frame <input id="frame" type="range" min="0" max="0" step="1" value="0"><span id="frameLbl">0/0</span></label>
      <label>Velocidad <input id="speed" type="range" min="1" max="60" value="10"><span id="fpsLbl">10</span> fps</label>
      <label><input id="textured" type="checkbox" checked> Texturas</label>
      <label><input id="lit" type="checkbox" checked> Luz</label>
      <label title="Dibuja todas las texturas sin transparencia en modo brillo: el negro desaparece, como las alas y efectos en el juego"><input id="bright" type="checkbox"> Negro = brillo</label>
      <label>Fondo <select id="bg"><option value="#2b3038">Gris</option><option value="#0b0c0f">Negro</option><option value="#7e8a99">Claro</option><option value="#2f6a3a">Verde</option></select></label>
      <button id="reset">Centrar</button>
      <button id="reveal" disabled title="Abre la carpeta del modelo en el Explorador, con el archivo seleccionado">📂 Abrir carpeta</button>
    </div>
  </main>

  <aside id="panel">
    <section><h2>Estado</h2><ul id="warn"><li class="ok">Sin modelo cargado</li></ul></section>
    <section><h2>Partes del modelo</h2><div id="meshes"></div></section>
    <section><h2>Imágenes en la carpeta</h2><div id="folderTex"></div></section>
  </aside>
</div>

<div id="modal" hidden>
  <div class="box">
    <div class="mhead"><span id="mtitle"></span><span><button id="mreveal">📂 Abrir carpeta</button> <button id="mclose">✕</button></span></div>
    <div class="mimg"><canvas id="mcanvas"></canvas></div>
    <div id="minfo"></div>
  </div>
</div>

<script src="formats.js"></script>
<script src="renderer.js"></script>
<script src="app.js"></script>
</body>
</html>
